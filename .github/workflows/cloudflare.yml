name: Deploy to CF

on:
  push:
    branches: [ "mera" ]
  pull_request:
    branches: [ "mera" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          toolchain: stable

      - name: Enviroment Deps
        run: sudo apt-get update && sudo apt-get install -y libssl3 libssl-dev libgcc-s1 libstdc++6 curl 
        
      - name: Cargo Binstall Installation
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Trunk Installation
        run: cargo binstall trunk --no-confirm
        
      - name: Dowload TailwindCSS
        run: curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64

      - name: Install TailwindCSS
        run: chmod +x tailwindcss-linux-x64 && sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Generate TailwindCSS
        run: tailwindcss -i styles/input.css -o styles/output.css -c tailwind.config.cjs

      - name: Build static assets
        env:
          GH_URL: ${{ vars.GH_URL }}
          X_URL: ${{ vars.X_URL }}
          PRIMAL_URL: ${{ vars.PRIMAL_URL }}
          MEDIUM_URL: ${{ vars.MEDIUM_URL}}
        run: trunk build --release
        
      - name: Publish
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: illuminodes # e.g. 'my-project'
          directory: dist # e.g. 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
